<!-- Dokumen HTML utama Geodashboard Bekasi (B-DRAIN). Vite menyuntikkan bundle React ke dalam elemen #root. -->
<!doctype html>
<!-- Atribut lang disetel ke "en", sedangkan antarmuka aplikasi berbahasa Indonesia. -->
<html lang="en">
  <head>
    <!-- Karakter set UTF-8 untuk teks berbahasa Indonesia. -->
    <meta charset="UTF-8" />
    <!-- Favicon yang diambil dari folder public (vite.svg). -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- Viewport agar tampilan menyesuaikan lebar layar perangkat mobile. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Judul yang tampil pada tab browser. -->
    <title>project</title>
  </head>
  <body>
    <!-- Kontainer tempat komponen App dirender oleh src/main.jsx. -->
    <div id="root"></div>
    <!-- Entry point modul JavaScript aplikasi. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
